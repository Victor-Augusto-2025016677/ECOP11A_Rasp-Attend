<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Status do Login</title>
<style>
  body {
    background: linear-gradient(135deg, #4e54c8, #8f94fb);
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    background: rgba(0,0,0,0.3);
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    text-align: center;
    min-width: 320px;
  }
  h1 { /* Estilo do título original, aplicado à mensagem */
    margin-bottom: 0; /* Removido ou ajustado, pois não há mais elementos abaixo */
    font-size: 1.8rem; /* Levemente ajustado para uma mensagem, pode ser 2rem se preferir */
    font-weight: 600;
  }
  p { /* Uma alternativa caso prefira um parágrafo para a mensagem */
    font-size: 1.2rem;
    font-weight: 500;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Você já está logado!</h1>
    <p style="margin-top: 15px;">Pode fechar esta página agora.</p>
  </div>
</body>
</html>
